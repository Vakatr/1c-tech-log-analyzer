[pytest]
testpaths = .
addopts = --strict-markers
markers =
    unit: fast, isolated tests with no external services
    gui: tests that create a Tk window
    db: tests that need a running ClickHouse server
    live: end-to-end tests against local vendor/LogT and ClickHouse
    windows: Windows-only behaviour
    posix: POSIX-only behaviour
    slow: tests that noticeably lengthen the default run
